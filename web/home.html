<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetflixLight — Welcome</title>
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

<canvas id="particles"></canvas>

<!-- Navbar -->
<nav class="home-nav">
  <div class="home-logo">Netflix<span>Light</span></div>
  <a href="login.html" class="btn-signin">Sign In</a>
</nav>

<!-- Hero plein écran -->
<div class="home-hero">
  <div class="home-hero-bg" id="home-hero-bg"></div>
  <div class="home-hero-overlay"></div>

  <div class="home-hero-content">

    <p class="home-badge">✦ Streaming Platform ✦</p>

    <h1 class="home-title">
      Unlimited <span>Films</span><br>& Series
    </h1>

    <p class="home-subtitle">
      Discover the best films and series of the moment.
    </p>

    <!-- Features inline -->
    <div class="home-features-inline">
      <div class="home-feature-inline">
        <span>🎬</span>
        <p>Thousands of Films</p>
      </div>
      <div class="home-divider"></div>
      <div class="home-feature-inline">
        <span>📺</span>
        <p>Series & Shows</p>
      </div>
      <div class="home-divider"></div>
      <div class="home-feature-inline">
        <span>⭐</span>
        <p>Top Rated</p>
      </div>
      <div class="home-divider"></div>
      <div class="home-feature-inline">
        <span>🔖</span>
        <p>Watchlist</p>
      </div>
    </div>

  </div>

  <!-- Indicateur de film en cours -->
  <div class="film-indicator" id="film-indicator"></div>

</div>

<script src="js/home.js"></script>

</body>
</html>
