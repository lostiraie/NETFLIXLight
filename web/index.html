<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetflixLight — Welcome</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/films.css">
</head>
<body>

<canvas id="particles"></canvas>

<div class="welcome-logo"><a href="/" class="welcome-logo">Netflix<span>Light</span></a></div>

<div class="welcome-page">

    <p class="welcome-badge">✦ &nbsp; Streaming Platform &nbsp; ✦</p>
    <h1 class="title">✦ WELCOME ✦</h1>
    <p class="welcome-subtitle">Discover the best films of the moment</p>

    <div class="welcome-stats">
        <div class="welcome-stat">
            <span class="stat-number" data-target="10000">0</span>
            <span class="stat-label">Films</span>
        </div>
        <div class="stat-sep">·</div>
        <div class="welcome-stat">
            <span class="stat-number" data-target="4">0</span><span class="stat-unit">K+</span>
            <span class="stat-label">Users</span>
        </div>
        <div class="stat-sep">·</div>
        <div class="welcome-stat">
            <span class="stat-number" data-target="100">0</span><span class="stat-unit">%</span>
            <span class="stat-label">Free</span>
        </div>
    </div>

    <div class="welcome-features">
        <div class="welcome-feature">
            <span class="feature-icon">🎬</span>
            <p>Films</p>
        </div>
        <div class="welcome-feature">
            <span class="feature-icon">⭐</span>
            <p>Top Rated</p>
        </div>
        <div class="welcome-feature">
            <span class="feature-icon">🔥</span>
            <p>Trends</p>
        </div>
        <div class="welcome-feature">
            <span class="feature-icon">❤️</span>
            <p>Favorites</p>
        </div>
    </div>

    <div class="welcome-actions">
        <a href="/films" class="welcome-btn">▶&nbsp;&nbsp;Discover Films</a>
        <a href="/login" class="welcome-btn-ghost">Sign In</a>
    </div>

    <div class="scroll-indicator"><span></span></div>

</div>

<script src="js/home.js"></script>
</body>
</html>
